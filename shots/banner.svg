<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Codefarm：用 C++ 写程序，让小 bot 替你种田">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9dcc0"/>
      <stop offset="0.62" stop-color="#b9bf98"/>
      <stop offset="1" stop-color="#9fa97e"/>
    </linearGradient>
    <linearGradient id="hillBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9aa77a"/>
      <stop offset="1" stop-color="#8a986c"/>
    </linearGradient>
    <linearGradient id="hillFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7f9061"/>
      <stop offset="1" stop-color="#6c7d52"/>
    </linearGradient>
    <linearGradient id="soilTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a5a3e"/>
      <stop offset="1" stop-color="#6a4c33"/>
    </linearGradient>
    <linearGradient id="soilSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3f2a"/>
      <stop offset="1" stop-color="#46311f"/>
    </linearGradient>
    <radialGradient id="body" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#f4e2b8"/>
      <stop offset="0.6" stop-color="#e0c592"/>
      <stop offset="1" stop-color="#c3a370"/>
    </radialGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6d8" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#fbeab4" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fbeab4" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <clipPath id="typeclip"><rect class="typed" x="112" y="232" width="292" height="40"/></clipPath>
    <clipPath id="frame"><rect width="1200" height="420" rx="28"/></clipPath>
    <style>
      .blade { transform-box: fill-box; transform-origin: 50% 100%; animation: sway 3.2s ease-in-out infinite alternate; }
      .b2 { animation-duration: 2.7s; animation-delay: -1.1s; }
      .b3 { animation-duration: 3.8s; animation-delay: -0.6s; }
      .b4 { animation-duration: 2.4s; animation-delay: -1.7s; }
      @keyframes sway { from { transform: rotate(-5deg); } to { transform: rotate(6deg); } }
      .bot { animation: bob 2.6s ease-in-out infinite; }
      @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      .eyes { transform-box: fill-box; transform-origin: 50% 50%; animation: look 7s ease-in-out infinite; }
      @keyframes look { 0%, 40%, 100% { transform: translateX(0); } 50%, 70% { transform: translateX(7px); } }
      .hoe { transform-box: fill-box; transform-origin: 10% 90%; animation: swing 2.6s ease-in-out infinite; }
      @keyframes swing { 0%, 60%, 100% { transform: rotate(0deg); } 72% { transform: rotate(-28deg); } 84% { transform: rotate(6deg); } }
      .cloud { animation: drift 40s linear infinite; }
      .cloud.c2 { animation-duration: 58s; animation-delay: -22s; }
      @keyframes drift { from { transform: translateX(-260px); } to { transform: translateX(1300px); } }
      .mote { animation: rise 6s ease-in-out infinite; }
      .m2 { animation-delay: -2s; } .m3 { animation-delay: -4s; }
      @keyframes rise { 0% { transform: translate(0, 0); opacity: 0; } 30% { opacity: 0.9; } 100% { transform: translate(24px, -70px); opacity: 0; } }
      .typed { animation: type 6s steps(24, end) infinite; }
      @keyframes type { 0% { width: 0; } 45%, 85% { width: 290px; } 100% { width: 0; } }
      .caret { animation: follow 6s steps(24, end) infinite; }
      @keyframes follow { 0% { transform: translateX(-292px); } 45%, 85% { transform: translateX(0); } 100% { transform: translateX(-292px); } }
      .title { font: 700 84px "Segoe UI", "Noto Sans", "Helvetica Neue", Arial, sans-serif; letter-spacing: -1px; }
      .sub { font: 500 26px "Microsoft YaHei UI", "PingFang SC", "Noto Sans CJK SC", "Noto Sans SC", sans-serif; }
      .code { font: 500 21px "JetBrains Mono", "Cascadia Code", Consolas, "SFMono-Regular", monospace; }
      .chip { font: 600 15px "Microsoft YaHei UI", "PingFang SC", "Noto Sans CJK SC", sans-serif; }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="420" fill="url(#sky)"/>
    <circle cx="1010" cy="96" r="150" fill="url(#sun)"/>

    <g class="cloud" opacity="0.75">
      <ellipse cx="140" cy="40" rx="64" ry="16" fill="#f2f1e2"/>
      <ellipse cx="176" cy="30" rx="40" ry="18" fill="#f2f1e2"/>
    </g>
    <g class="cloud c2" opacity="0.55">
      <ellipse cx="60" cy="64" rx="80" ry="14" fill="#eeeddc"/>
      <ellipse cx="104" cy="54" rx="44" ry="16" fill="#eeeddc"/>
    </g>

    <path d="M0 300 C 180 250 330 270 520 262 C 720 252 880 214 1200 246 L1200 420 L0 420 Z" fill="url(#hillBack)"/>
    <g opacity="0.8">
      <circle cx="1090" cy="236" r="34" fill="#6f8752"/>
      <rect x="1086" y="250" width="8" height="26" rx="3" fill="#7a5b40"/>
      <circle cx="1140" cy="244" r="24" fill="#7b9258"/>
      <circle cx="96" cy="276" r="26" fill="#738b55"/>
      <rect x="93" y="288" width="7" height="20" rx="3" fill="#7a5b40"/>
    </g>
    <path d="M0 340 C 220 300 420 330 640 318 C 860 306 1000 290 1200 304 L1200 420 L0 420 Z" fill="url(#hillFront)"/>

    <!-- Field block, the same soft rounded tile as in the game -->
    <ellipse cx="900" cy="372" rx="190" ry="24" fill="#3e4a2c" opacity="0.28" filter="url(#soft)"/>
    <rect x="740" y="296" width="320" height="76" rx="26" fill="url(#soilSide)"/>
    <rect x="740" y="276" width="320" height="56" rx="26" fill="url(#soilTop)"/>
    <rect x="752" y="282" width="296" height="12" rx="6" fill="#8d6a4a" opacity="0.55"/>

    <g fill="#7fa64a">
      <path class="blade" d="M770 300 C 768 270 772 246 784 226 C 782 254 784 278 782 300 Z"/>
      <path class="blade b2" d="M792 300 C 794 268 806 246 820 236 C 810 262 806 282 804 300 Z" fill="#6c9440"/>
      <path class="blade b3" d="M1012 300 C 1010 266 1016 244 1030 226 C 1026 256 1026 280 1024 300 Z"/>
      <path class="blade b4" d="M1036 300 C 1036 274 1044 256 1054 248 C 1048 270 1048 286 1046 300 Z" fill="#8fb456"/>
      <path class="blade b2" d="M980 300 C 976 276 978 260 986 246 C 986 266 990 284 990 300 Z" fill="#6c9440"/>
    </g>

    <!-- The bot: milk-yellow bean, black vertical-bar eyes, a hoe -->
    <g class="bot">
      <ellipse cx="900" cy="300" rx="62" ry="10" fill="#4a3826" opacity="0.35"/>
      <g class="hoe">
        <rect x="984" y="168" width="9" height="124" rx="4.5" fill="#9a6a42" transform="rotate(16 988 230)"/>
        <ellipse cx="1010" cy="170" rx="30" ry="9" fill="#a3ad97" transform="rotate(18 1010 170)"/>
      </g>
      <ellipse cx="843" cy="252" rx="13" ry="18" fill="#d8bb85"/>
      <circle cx="900" cy="236" r="64" fill="url(#body)"/>
      <circle cx="900" cy="236" r="64" fill="none" stroke="#8d7150" stroke-opacity="0.35" stroke-width="3"/>
      <ellipse cx="878" cy="206" rx="20" ry="11" fill="#fff8e4" opacity="0.5"/>
      <g class="eyes">
        <rect x="882" y="218" width="10" height="28" rx="5" fill="#1d1c18"/>
        <rect x="908" y="218" width="10" height="28" rx="5" fill="#1d1c18"/>
      </g>
      <ellipse cx="957" cy="252" rx="13" ry="18" fill="#d8bb85"/>
    </g>

    <g fill="#fff9e3">
      <circle class="mote" cx="820" cy="260" r="3"/>
      <circle class="mote m2" cx="1000" cy="250" r="2.5"/>
      <circle class="mote m3" cx="900" cy="270" r="2"/>
    </g>

    <!-- Title -->
    <text x="72" y="148" class="title" fill="#2b3527">Codefarm</text>
    <text x="76" y="196" class="sub" fill="#3c4a35">用真正的 C++ 写程序，让小 bot 替你种田</text>

    <!-- Code chip that types itself -->
    <rect x="72" y="226" width="380" height="52" rx="14" fill="#1f2a24" opacity="0.92"/>
    <circle cx="96" cy="252" r="6" fill="#9fc18a"/>
    <g clip-path="url(#typeclip)"><text x="114" y="259" class="code"><tspan fill="#c7a6e0">while</tspan><tspan fill="#d8dccd"> (</tspan><tspan fill="#c7a6e0">true</tspan><tspan fill="#d8dccd">) </tspan><tspan fill="#a8cf8e">harvest</tspan><tspan fill="#d8dccd">();</tspan></text></g>
    <rect class="caret" x="410" y="240" width="3" height="24" rx="1.5" fill="#e6c87a"/>

    <!-- Little chips -->
    <g class="chip">
      <rect x="72" y="298" width="96" height="32" rx="16" fill="#f3efd9" opacity="0.85"/>
      <text x="120" y="319" text-anchor="middle" fill="#4b5a3f">39 个技能</text>
      <rect x="178" y="298" width="96" height="32" rx="16" fill="#f3efd9" opacity="0.85"/>
      <text x="226" y="319" text-anchor="middle" fill="#4b5a3f">先痛后药</text>
      <rect x="284" y="298" width="112" height="32" rx="16" fill="#f3efd9" opacity="0.85"/>
      <text x="340" y="319" text-anchor="middle" fill="#4b5a3f">Godot 4.7</text>
    </g>
  </g>
</svg>
